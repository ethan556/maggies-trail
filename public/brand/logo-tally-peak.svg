<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Maggie's Trail logo: four tally strokes with a fifth stroke rising as a trail to a summit dot">
  <!-- Tally Peak — primary mark. Ink on paper; tangerine summit dot. -->
  <g stroke="#22314F" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="28" y1="34" x2="28" y2="78"/>
    <line x1="44" y1="34" x2="44" y2="78"/>
    <line x1="60" y1="34" x2="60" y2="78"/>
    <line x1="76" y1="34" x2="76" y2="78"/>
    <polyline points="14,86 56,48 80,26" stroke-linejoin="round"/>
  </g>
  <circle cx="80" cy="26" r="7.5" fill="#FF8A3D"/>
</svg>
