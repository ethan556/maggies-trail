<?xml version="1.0" encoding="UTF-8"?>
<!--
  DEV PLACEHOLDER — see AVATAR_ART_PRODUCTION_SPEC.md. This is NOT final avatar art and must never
  be presented as a selectable avatar option. It exists only as a last-resort visual fallback (for
  example: before a learner has chosen an avatar, or when a stored avatarId no longer validates)
  while src/lib/avatars.ts has zero enabled entries. It is a deliberately generic, featureless
  silhouette — two overlapping ellipses at low opacity — so it cannot be mistaken for a character
  portrait. No board crop from design-reference/ws-j-avatar-board-*.png is used here or anywhere;
  see AVATAR_CONCEPT_LEDGER.md and AVATAR_ART_PRODUCTION_SPEC.md for why.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="placeholderAvatarTitle">
  <title id="placeholderAvatarTitle">Placeholder avatar — not final art</title>
  <rect width="256" height="256" fill="#F7F3EC"/>
  <!-- head -->
  <ellipse cx="128" cy="102" rx="44" ry="48" fill="#0D1B2A" fill-opacity="0.26"/>
  <!-- shoulders/body — extends past the bottom edge; the root <svg>'s default clipping crops it -->
  <ellipse cx="128" cy="232" rx="88" ry="78" fill="#0D1B2A" fill-opacity="0.26"/>
</svg>
